<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini MoonBoard DIY</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoonBoard">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.2rem; margin: 5px 0 10px 0; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 420px;
    }

    .route-selector {
      width: 100%;
      max-width: 420px;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 10px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      appearance: none;
      text-align: center;
    }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      flex: 1;
    }
    button:active { background: #555; }
    
    .btn-save { background: #005bb5; border-color: #0073e6; }
    .btn-save:active { background: #003f7a; }
    
    .btn-delete { background: #d9534f; border-color: #d43f3a; }
    .btn-delete:active { background: #c9302c; }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transition: background-color 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }
    .status-dot.disconnected { background-color: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, 0.6); }
    .status-dot.connected { background-color: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.8); }

    .board-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 11 / 12;
      background: url('mini_moonboard_bg.jpg') no-repeat center/cover;
      border: 2px solid #444;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(12, 1fr);
      width: 100%;
      height: 100%;
      padding: 7% 1% 6% 7%; 
    }

    .hold {
      width: 85%;
      height: 85%;
      margin: 7.5%;
      border-radius: 50%;
      transition: all 0.15s ease-out;
      cursor: pointer;
    }

    .hold.state-0 { background-color: transparent; }
    .hold.state-1 { border: 3px solid #00ff00; background-color: rgba(0, 255, 0, 0.3); box-shadow: 0 0 10px #00ff00; }
    .hold.state-2 { border: 3px solid #0088ff; background-color: rgba(0, 136, 255, 0.3); box-shadow: 0 0 10px #0088ff; }
    .hold.state-3 { border: 3px solid #ff0000; background-color: rgba(255, 0, 0, 0.3); box-shadow: 0 0 10px #ff0000; }
  </style>
</head>
<body>

  <h1>Mini MoonBoard</h1>

  <div class="controls-row">
    <button id="btnConnect" onclick="connectBLE()">Se connecter</button>
    <div id="statusIndicator" class="status-dot disconnected"></div>
    <button onclick="clearBoard()">Effacer</button>
  </div>

  <div class="controls-row">
    <button class="btn-save" onclick="saveCurrentRoute()">💾 Enregistrer</button>
    <button class="btn-delete" onclick="clearSavedRoutes()">🗑️ Vider ma liste</button>
  </div>

  <div class="route-selector">
    <select id="routeSelect" onchange="loadSelectedRoute()">
      <!-- Les options seront ajoutées ici -->
    </select>
  </div>

  <div class="board-container">
    <div class="grid" id="boardGrid"></div>
  </div>

  <script>
    const cols = ['A','B','C','D','E','F','G','H','I','J','K'];
    const rows = 12;
    let holdStates = {};

    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice = null;
    let rxCharacteristic = null;

    // Blocs "en dur" optionnels (tu peux les effacer si tu n'en veux plus)
    const hardcodedRoutes = {};

    // Chargement des blocs depuis la mémoire du téléphone
    let localRoutes = JSON.parse(localStorage.getItem('moonboard_custom_routes')) || {};
    let allRoutes = { ...hardcodedRoutes, ...localRoutes };

    function initRouteSelector() {
      const selector = document.getElementById('routeSelect');
      selector.innerHTML = '<option value="">-- Choisir un bloc --</option>';
      
      allRoutes = { ...hardcodedRoutes, ...localRoutes }; 
      
      Object.keys(allRoutes).forEach(routeName => {
        const opt = document.createElement('option');
        opt.value = routeName;
        opt.innerText = routeName;
        selector.appendChild(opt);
      });
    }

    function saveCurrentRoute() {
      let route = { depart: [], progression: [], arrivee: [] };
      let hasHolds = false;

      Object.keys(holdStates).forEach(id => {
        if (holdStates[id] === 1) { route.depart.push(id); hasHolds = true; }
        if (holdStates[id] === 2) { route.progression.push(id); hasHolds = true; }
        if (holdStates[id] === 3) { route.arrivee.push(id); hasHolds = true; }
      });

      if (!hasHolds) {
        alert("Le panneau est vide ! Ajoute des prises avant d'enregistrer.");
        return;
      }

      let routeName = prompt("Nom et cotation du bloc (ex: Projet V5) :");
      if (!routeName || routeName.trim() === "") return;

      localRoutes[routeName] = route;
      localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
      
      initRouteSelector();
      document.getElementById('routeSelect').value = routeName;
    }

    // Nouvelle fonction pour effacer la liste enregistrée
    function clearSavedRoutes() {
      if (Object.keys(localRoutes).length === 0) {
        alert("Ta liste est déjà vide !");
        return;
      }
      
      const confirmDelete = confirm("Voulez-vous vraiment effacer tous vos blocs enregistrés ? Cette action est irréversible.");
      
      if (confirmDelete) {
        localStorage.removeItem('moonboard_custom_routes');
        localRoutes = {};
        initRouteSelector();
        document.getElementById('routeSelect').value = "";
        alert("Liste effacée avec succès !");
      }
    }

    function loadSelectedRoute() {
      const selector = document.getElementById('routeSelect');
      const routeName = selector.value;
      
      Object.keys(holdStates).forEach(id => { holdStates[id] = 0; updateUI(id); });

      if (routeName && allRoutes[routeName]) {
        const route = allRoutes[routeName];
        if (route.depart) route.depart.forEach(id => { holdStates[id] = 1; updateUI(id); });
        if (route.progression) route.progression.forEach(id => { holdStates[id] = 2; updateUI(id); });
        if (route.arrivee) route.arrivee.forEach(id => { holdStates[id] = 3; updateUI(id); });
      }
      sendBLEFrame();
    }

    const gridEl = document.getElementById('boardGrid');
    for (let r = rows; r >= 1; r--) {
      cols.forEach(c => {
        const holdId = `${c}${r}`;
        holdStates[holdId] = 0;
        const div = document.createElement('div');
        div.className = 'hold state-0';
        div.id = `hold-${holdId}`;
        div.onclick = () => toggleHold(holdId);
        gridEl.appendChild(div);
      });
    }

    initRouteSelector();

    function toggleHold(holdId) {
      holdStates[holdId] = (holdStates[holdId] + 1) % 4;
      updateUI(holdId);
      document.getElementById('routeSelect').value = ""; 
      sendBLEFrame();
    }

    function updateUI(holdId) {
      const el = document.getElementById(`hold-${holdId}`);
      el.className = `hold state-${holdStates[holdId]}`;
    }

    function clearBoard() {
      document.getElementById('routeSelect').value = ""; 
      Object.keys(holdStates).forEach(id => {
        if(holdStates[id] !== 0) { holdStates[id] = 0; updateUI(id); }
      });
      sendBLEFrame();
    }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'MoonBoard' }],
          optionalServices: [SERVICE_UUID]
        });
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        document.getElementById('btnConnect').innerText = "Connecté";
        document.getElementById('statusIndicator').className = "status-dot connected";
      } catch (err) {
        alert("Erreur BLE : " + err);
        onDisconnected();
      }
    }

    function onDisconnected() {
      rxCharacteristic = null;
      document.getElementById('btnConnect').innerText = "Se connecter";
      document.getElementById('statusIndicator').className = "status-dot disconnected";
    }

    function sendBLEFrame() {
      if (!rxCharacteristic) return;
      let parts = [];
      Object.keys(holdStates).forEach(id => {
        const state = holdStates[id];
        if (state === 1) parts.push(`S${id}`);
        else if (state === 2) parts.push(`P${id}`);
        else if (state === 3) parts.push(`F${id}`);
      });
      const frame = `l#${parts.join(',')}#`;
      const encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(frame));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
