<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonBoard LED Controller</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: #333; margin-top: 0; }

        /* Groupes de contrôles */
        .control-group { margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background-color: #e0e0e0; font-weight: bold; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; margin-bottom: 10px; font-family: monospace; }

        /* Filtres sur la même ligne */
        .filter-group { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        .filter-group input[type="text"], .filter-group select { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            flex: 1; 
            min-width: 150px; 
        }
        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            cursor: pointer; 
            white-space: nowrap; 
            font-size: 16px;
            user-select: none;
        }

        /* Liste des voies et badges */
        .route-item { 
            padding: 12px 15px; 
            border: 1px solid #eee; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: background 0.2s; 
            display: flex; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        .route-item:hover { background-color: #f8f9fa; border-color: #ccc; }
        .route-name { font-weight: bold; font-size: 16px; color: #333; }
        .route-grade { background: #333; color: white; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .route-benchmark { color: #d4af37; font-weight: bold; font-size: 14px; display: flex; align-items: center; }

        /* Couleurs des règles de réalisation (Method) */
        .route-method { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
        .method-nokickboard { background-color: #dc3545; } /* Rouge */
        .method-footless { background-color: #6f42c1; } /* Violet */
        .method-anymarked { background-color: #28a745; } /* Vert */
        .method-default { background-color: #6c757d; } /* Gris par défaut */
    </style>
</head>
<body>
    <div class="container">
        <h1>MoonBoard Controller</h1>

        <!-- Boutons du haut -->
        <div id="top-controls" class="control-group">
            <button id="btn-connect" class="btn btn-primary">Connecter ESP32</button>
            <button id="btn-clear" class="btn btn-danger">Éteindre les LEDs</button>
        </div>

        <!-- Zone d'importation de la base de données -->
        <div id="import-section" class="control-group">
            <textarea id="json-input" placeholder="Colle la base de données JSON complète ici..." rows="3"></textarea>
            <button id="btn-import" class="btn">Charger les voies</button>
        </div>

        <!-- Filtres (alignés sur la même ligne) -->
        <div id="filters" class="filter-group">
            <input type="text" id="search-name" placeholder="Nom du bloc...">
            
            <select id="search-grade">
                <option value="">Toutes les cotations</option>
                <option value="6A+">6A+</option>
                <option value="6B">6B</option>
                <option value="6B+">6B+</option>
                <option value="6C">6C</option>
                <option value="6C+">6C+</option>
                <option value="7A">7A</option>
                <option value="7A+">7A+</option>
                <option value="7B">7B</option>
                <option value="7B+">7B+</option>
                <option value="7C">7C</option>
                <option value="7C+">7C+</option>
                <option value="8A">8A</option>
            </select>
            
            <label class="checkbox-label">
                <input type="checkbox" id="filter-benchmark">
                <strong>Benchmark</strong>
            </label>
        </div>

        <!-- Conteneur de la liste des voies -->
        <div id="routes-list"></div>
    </div>

    <script>
        let database = [];

        // Importer et parser le JSON
        document.getElementById('btn-import').addEventListener('click', () => {
            const jsonString = document.getElementById('json-input').value;
            if (!jsonString.trim()) {
                alert("Veuillez coller du texte JSON avant de charger.");
                return;
            }
            
            try {
                const parsedData = JSON.parse(jsonString);
                database = Array.isArray(parsedData) ? parsedData : (parsedData.data || Object.values(parsedData) || []);
                
                alert(`${database.length} voies chargées avec succès !`);
                applyFilters(); 
            } catch (error) {
                alert("Erreur : Le texte collé n'est pas un format JSON valide.");
                console.error("Détails de l'erreur :", error);
            }
        });

        // Filtrer la base de données
        function applyFilters() {
            const nameQuery = document.getElementById('search-name').value.toLowerCase();
            const gradeQuery = document.getElementById('search-grade').value;
            const benchmarkOnly = document.getElementById('filter-benchmark').checked;

            const filteredRoutes = database.filter(route => {
                const safeName = route.name ? route.name.toLowerCase() : "";
                const matchName = safeName.includes(nameQuery);
                
                const safeGrade = route.grade || route.userGrade || "";
                const matchGrade = (gradeQuery === "") || (safeGrade === gradeQuery);
                
                const matchBenchmark = benchmarkOnly ? (route.isBenchmark === true) : true;

                return matchName && matchGrade && matchBenchmark;
            });

            renderRoutes(filteredRoutes);
        }

        // Écouteurs pour mettre à jour la liste en temps réel
        document.getElementById('search-name').addEventListener('input', applyFilters);
        document.getElementById('search-grade').addEventListener('change', applyFilters);
        document.getElementById('filter-benchmark').addEventListener('change', applyFilters);

        // Déterminer la couleur de la règle de réalisation
        function getMethodColorClass(methodString) {
            if (!methodString) return 'method-default';
            const lowerMethod = methodString.toLowerCase();
            
            if (lowerMethod.includes('no kickboard')) return 'method-nokickboard';
            if (lowerMethod.includes('footless')) return 'method-footless';
            if (lowerMethod.includes('any marked')) return 'method-anymarked';
            
            return 'method-default';
        }

        // Afficher les voies
        function renderRoutes(routes) {
            const container = document.getElementById('routes-list');
            container.innerHTML = ""; 

            routes.forEach(route => {
                const div = document.createElement('div');
                div.className = "route-item";
                
                const grade = route.grade || route.userGrade || "N/A";
                const methodText = route.method || "Standard";
                const methodClass = getMethodColorClass(methodText);
                
                const benchmarkHtml = route.isBenchmark ? '<span class="route-benchmark">★ Benchmark</span>' : '';

                div.innerHTML = `
                    <span class="route-name">${route.name}</span>
                    <span class="route-grade">${grade}</span>
                    <span class="route-method ${methodClass}">${methodText}</span>
                    ${benchmarkHtml}
                `;
                
                // Action au clic pour envoyer les LEDs à l'ESP32
                div.addEventListener('click', () => {
                    console.log(`Envoi du bloc "${route.name}" à l'ESP32...`, route.moves);
                    
                    // Assure-toi que ta fonction d'envoi à l'ESP32 est bien appelée ici
                    // Exemple : envoiBluetooth(route.moves) ou websocket.send(...)
                });

                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
