            background-color: #1e1e1e; 
            border: 1px solid #e67e22; 
            color: #e67e22;

            text-align: center;
        }
        
        .btn-discreet { background-color: #333; color: #aaa; padding: 8px; }

        button.active-pencil {
            background-color: #f1c40f !important;
            color: #000 !important;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
            transform: scale(1.05);
        }

        .edit-kickboard-container {
            display: none; 
            align-items: center;
            gap: 5px;
            background-color: #dc3545;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;

        .nav-container {

        }
        
        .chk-completed {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 450px;
            font-size: 0.8rem;

            margin-bottom: 8px;

            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .footer-info span {
            font-weight: bold;
            font-size: 0.8rem;
            color: #ffb700;
            text-align: right;
        }

        .board-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 11 / 12;
            background-color: #f4d03f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);

            touch-action: pan-y;
        }
        .board-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .grid-overlay {
            position: absolute;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(12, 1fr);
            z-index: 10;
        }
        
        .grid-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .hold {
            width: 170%; 
            aspect-ratio: 1;
            border-radius: 50%;
            background: transparent;
            box-sizing: border-box;
            border: none;
            pointer-events: none; 
            transition: transform 0.1s;
        }
        
        .hold.depart { 
            border: 3px solid #00ff00; 
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.8); 
        }
        .hold.progression { 
            border: 3px solid #00d2ff; 
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.8); 
        }
        .hold.arrivee { 
            border: 3px solid #ff0000; 
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8); 
        }

            border: 1px dashed rgba(255, 255, 255, 0.6) !important;
            background: rgba(255, 255, 255, 0.2) !important;
            box-shadow: none !important;
        }

        .modal {
            display: none; 
            position: fixed; 
            top: 5px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            width: 95%;
            max-width: 350px;
            background: transparent;
        }
