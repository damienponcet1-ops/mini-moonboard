<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini MoonBoard DIY</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoonBoard">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.2rem; margin: 5px 0 15px 0; }

    /* Barre de contrôle avec l'indicateur Bluetooth */
    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: #555; }

    /* Pastille d'état Bluetooth */
    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .status-dot.disconnected { background-color: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, 0.6); }
    .status-dot.connected { background-color: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.8); }

    /* Conteneur de l'image du panneau */
    .board-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 11 / 12; /* Ratio strict du Mini MoonBoard */
      background: url('mini_moonboard_bg.jpg') no-repeat center/cover;
      border: 2px solid #444;
      border-radius: 8px;
    }

    /* Grille 11x12 superposée */
    .grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(12, 1fr);
      width: 100%;
      height: 100%;
      /* Marges intérieures pour compresser la grille et l'aligner sur ta photo */
      /* Ajuste ces % si besoin : Haut, Droite, Bas, Gauche */
      padding: 5% 4% 8% 4%; 
    }

    /* Style des cercles de sélection avec texte A1, B2... */
    .hold {
      width: 85%;
      height: 85%;
      margin: 7.5%;
      border-radius: 50%;
      transition: all 0.15s ease-out;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.7); /* Texte blanc semi-transparent */
    }

    /* État 0 : Éteint */
    .hold.state-0 { border: 1px dashed rgba(255, 255, 255, 0.2); background-color: transparent; }

    /* État 1 : Départ (Vert) */
    .hold.state-1 { border: 3px solid #00ff00; background-color: rgba(0, 255, 0, 0.3); box-shadow: 0 0 10px #00ff00; color: #fff; }
    
    /* État 2 : Progression (Bleu) */
    .hold.state-2 { border: 3px solid #0088ff; background-color: rgba(0, 136, 255, 0.3); box-shadow: 0 0 10px #0088ff; color: #fff; }
    
    /* État 3 : Arrivée (Rouge) */
    .hold.state-3 { border: 3px solid #ff0000; background-color: rgba(255, 0, 0, 0.3); box-shadow: 0 0 10px #ff0000; color: #fff; }
    
    /* État 4 : Pied (Jaune) */
    .hold.state-4 { border: 3px solid #ffff00; background-color: rgba(255, 255, 0, 0.3); box-shadow: 0 0 10px #ffff00; color: #fff; }

  </style>
</head>
<body>

  <h1>Mini MoonBoard</h1>

  <div class="controls">
    <button id="btnConnect" onclick="connectBLE()">Se connecter</button>
    <div id="statusIndicator" class="status-dot disconnected"></div>
    <button onclick="clearBoard()">Effacer</button>
  </div>

  <div class="board-container">
    <div class="grid" id="boardGrid"></div>
  </div>

  <script>
    const cols = ['A','B','C','D','E','F','G','H','I','J','K'];
    const rows = 12;
    let holdStates = {};

    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice = null;
    let rxCharacteristic = null;

    // Construction de la grille tactile (Ligne 12 en haut -> Ligne 1 en bas)
    const gridEl = document.getElementById('boardGrid');
    for (let r = rows; r >= 1; r--) {
      cols.forEach(c => {
        const holdId = `${c}${r}`;
        holdStates[holdId] = 0; // 0 = éteint

        const div = document.createElement('div');
        div.className = 'hold state-0';
        div.id = `hold-${holdId}`;
        
        // Affiche le nom de la prise (ex: A1) dans le cercle
        div.innerText = holdId; 
        
        div.onclick = () => toggleHold(holdId);
        gridEl.appendChild(div);
      });
    }

    // Gestion des couleurs : Vert -> Bleu -> Rouge -> Jaune -> Éteint
    function toggleHold(holdId) {
      holdStates[holdId] = (holdStates[holdId] + 1) % 5;
      updateUI(holdId);
      sendBLEFrame();
    }

    // Mise à jour visuelle du cercle
    function updateUI(holdId) {
      const el = document.getElementById(`hold-${holdId}`);
      el.className = `hold state-${holdStates[holdId]}`;
    }

    function clearBoard() {
      Object.keys(holdStates).forEach(id => {
        if(holdStates[id] !== 0) {
          holdStates[id] = 0;
          updateUI(id);
        }
      });
      sendBLEFrame();
    }

    // Connexion Bluetooth
    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'MoonBoard' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        
        // Mise à jour de l'interface (Connecté)
        document.getElementById('btnConnect').innerText = "Connecté";
        document.getElementById('statusIndicator').className = "status-dot connected";

      } catch (err) {
        alert("Erreur BLE : " + err);
        onDisconnected();
      }
    }

    // Gestion de la déconnexion
    function onDisconnected() {
      rxCharacteristic = null;
      document.getElementById('btnConnect').innerText = "Se connecter";
      document.getElementById('statusIndicator').className = "status-dot disconnected";
    }

    // Envoi des données à l'ESP32
    function sendBLEFrame() {
      if (!rxCharacteristic) return;

      let parts = [];
      Object.keys(holdStates).forEach(id => {
        const state = holdStates[id];
        if (state === 1) parts.push(`S${id}`);      // Départ
        else if (state === 2) parts.push(`P${id}`); // Progression
        else if (state === 3) parts.push(`F${id}`); // Arrivée
        else if (state === 4) parts.push(`E${id}`); // Pied
      });

      const frame = `l#${parts.join(',')}#`;
      const encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(frame));
    }

    // Lancement du Service Worker pour le mode hors-ligne
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
