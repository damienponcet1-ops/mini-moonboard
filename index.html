<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini MoonBoard DIY</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoonBoard">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { margin: 0; padding: 10px; background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; position: relative; }
    
    .version-badge { position: absolute; top: 10px; right: 15px; font-size: 0.75rem; color: #777; background: #222; padding: 3px 6px; border-radius: 4px; border: 1px solid #444; }

    /* Le petit point minimaliste pour "No Kickboard" en haut à gauche */
    .kickboard-dot { position: absolute; top: 12px; left: 15px; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: all 0.3s; border: 1px solid #555; background-color: #333; }
    .kickboard-dot.active { background-color: #ff3b30; border-color: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, 0.8); }

    .title-container { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 420px; margin: 5px 0 8px 0; overflow: hidden; }
    
    .btn-copy { background: transparent; border: 1px solid #555; color: #aaa; border-radius: 6px; padding: 4px 8px; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; height: 28px; flex-shrink: 0; }
    .btn-copy:active { background: #333; color: #fff; }

    h1 { font-size: 1.1rem; margin: 0; color: #f39c12; transition: color 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

    .controls-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; width: 100%; max-width: 420px; }
    
    .compact-row { gap: 6px; }
    .compact-row button, .filter-select-mini { padding: 8px 4px; font-size: 13px; flex: 1; border-radius: 6px; }
    
    .filter-select-mini { background-color: #1a1a1a; color: #f39c12; border: 1px solid #f39c12; font-weight: bold; appearance: none; text-align: center; cursor: pointer; }

    .overlay-controls { display: none; flex-direction: column; gap: 5px; margin-bottom: 8px; width: 100%; max-width: 420px; background: #1e1e1e; padding: 8px; border-radius: 6px; border: 1px solid #444; }

    .opacity-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
    .opacity-row input[type="range"] { flex: 1; }
    .opacity-row label { width: 65px; text-align: right; }
    
    .btn-toggle { background: #555; color: white; border: 1px solid #777; font-size: 0.8rem; padding: 6px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .btn-toggle:active { background: #777; }

    .calibration-panel { display: none; flex-direction: column; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #444; }

    .route-nav-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; max-width: 420px; margin-bottom: 8px; }
    .btn-nav { background: #444; color: #fff; border: 1px solid #666; font-size: 16px; padding: 8px 14px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
    .btn-nav:active { background: #666; }
    
    select { flex: 1; padding: 8px; background-color: #222; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 15px; font-weight: bold; appearance: none; text-align: center; min-width: 0; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
    
    .chk-completed { width: 24px; height: 24px; accent-color: #34c759; margin-left: 4px; cursor: pointer; flex-shrink: 0; visibility: hidden; }

    button { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
    button:active { background: #555; }
    
    .btn-scan { background: #e67e22; border-color: #d35400; }
    .btn-scan:active { background: #bf4a00; }
    
    /* Boutons Ligne 3 (Enregistrer, Supprimer, Vider) */
    .btn-save { background: #005bb5; border-color: #0073e6; flex: 2;}
    .btn-save:active { background: #003f7a; }
    .btn-remove { background: #d9534f; border-color: #d43f3a; flex: 1.5; padding: 8px 4px; }
    .btn-remove:active { background: #c9302c; }
    .btn-delete { background: #555; border-color: #444; flex: 1; padding: 8px 4px; }
    .btn-delete:active { background: #333; }
    
    .btn-export { background: #27ae60; border-color: #2ecc71; flex:1; padding: 8px 4px;}
    .btn-export:active { background: #1e8449; }
    
    /* Boutons d'importation (Fichier et Coller) */
    .btn-import-file { background: #8e44ad; border-color: #9b59b6; flex:1; padding: 8px 4px; }
    .btn-import-file:active { background: #6c3483; }
    
    /* NOUVEAU bouton pour coller directement le JSON */
    .btn-import-paste { background: #c39bd3; color: #333; border: 1px solid #9b59b6; flex:1.5; padding: 8px 2px; font-size: 12px;}
    .btn-import-paste:active { background: #a569bd; color: white; }

    .status-dot { width: 14px; height: 14px; border-radius: 50%; transition: background-color 0.3s, box-shadow 0.3s; flex-shrink: 0; }
    .status-dot.disconnected { background-color: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, 0.6); }
    .status-dot.connected { background-color: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.8); }

    .board-container { position: relative; width: 100%; max-width: 420px; aspect-ratio: 11 / 12; background: url('mini_moonboard_bg.jpg') no-repeat center/cover; border: 2px solid #444; border-radius: 8px; overflow: hidden; }

    #overlayImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; opacity: 0.5; z-index: 1; transform-origin: center center; }

    .grid { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(12, 1fr); width: 100%; height: 100%; padding: 7% 1% 6% 7%; }

    .hold { width: 85%; height: 85%; margin: 7.5%; border-radius: 50%; transition: all 0.15s ease-out; cursor: pointer; }
    .hold.state-0 { background-color: transparent; }
    .hold.state-1 { border: 3px solid #00ff00; background-color: rgba(0, 255, 0, 0.4); box-shadow: 0 0 10px #00ff00; }
    .hold.state-2 { border: 3px solid #0088ff; background-color: rgba(0, 136, 255, 0.4); box-shadow: 0 0 10px #0088ff; }
    .hold.state-3 { border: 3px solid #ff0000; background-color: rgba(255, 0, 0, 0.4); box-shadow: 0 0 10px #ff0000; }
  </style>
</head>
<body>

  <div class="version-badge">V49</div>
  
  <!-- Point rouge No Kickboard (en haut à gauche) -->
  <div id="kickboardDot" class="kickboard-dot" onclick="toggleKickboard()" title="No Kickboard (Clique pour activer/désactiver)"></div>
  
  <div class="title-container">
    <button class="btn-copy" id="btnCopyTitle" onclick="copyTitle()" title="Copier le nom du bloc">📋</button>
    <h1 id="pageTitle">Mini MoonBoard</h1>
  </div>

  <!-- Ligne 1 -->
  <div class="controls-row compact-row">
    <button id="btnConnect" onclick="toggleBLE()">Se connecter</button>
    <div id="statusIndicator" class="status-dot disconnected"></div>
    <button onclick="clearBoard()">Effacer</button>
    <select id="gradeFilter" class="filter-select-mini" onchange="initRouteSelector()">
      <option value="">Cotation</option>
      <option value="6A+">6A+</option>
      <option value="6B">6B</option>
      <option value="6B+">6B+</option>
      <option value="6C">6C</option>
      <option value="6C+">6C+</option>
      <option value="7A">7A</option>
      <option value="7A+">7A+</option>
      <option value="7B">7B</option>
      <option value="7B+">7B+</option>
      <option value="7C">7C</option>
      <option value="7C+">7C+</option>
      <option value="8A">8A</option>
      <option value="8A+">8A+</option>
      <option value="8B">8B</option>
      <option value="8B+">8B+</option>
    </select>
  </div>

  <!-- Ligne 2 : Fichiers et Imports -->
  <div class="controls-row compact-row">
    <button class="btn-export" onclick="exportRoutes()">📤 Exporter</button>
    <!-- Boutons d'import réorganisés -->
    <button class="btn-import-file" onclick="document.getElementById('importInput').click()">📥 Fichier</button>
    <button class="btn-import-paste" onclick="importFromPaste()">📋 Coller JSON</button>
    
    <button class="btn-scan" onclick="document.getElementById('fileInput').click()">📷 Charger</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importRoutes(event)">
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <!-- Ligne 3 : Sauvegarde et Suppression -->
  <div class="controls-row">
    <button class="btn-save" onclick="saveCurrentRoute()">💾 Enregistrer</button>
    <button class="btn-remove" onclick="deleteCurrentRoute()">❌ Supprimer</button>
    <button class="btn-delete" onclick="clearSavedRoutes()">⚠️ Vider</button>
  </div>

  <!-- Ligne 4 : Navigation et Coche -->
  <div class="route-nav-row">
    <button class="btn-nav" onclick="prevRoute()">◄</button>
    <select id="routeSelect" onchange="loadSelectedRoute()"></select>
    <button class="btn-nav" onclick="nextRoute()">►</button>
    <input type="checkbox" id="chkCompleted" class="chk-completed" onchange="toggleCompleted()" title="Marquer comme réalisé">
  </div>

  <div class="overlay-controls" id="overlayControls">
    <div class="opacity-row" id="multiImageNav" style="display:none; justify-content: center; gap: 15px;">
      <button class="btn-toggle" onclick="prevOverlayImage()">◄ Photo</button>
      <span id="imageCounter" style="color:#f39c12; font-weight:bold;">1/1</span>
      <button class="btn-toggle" onclick="nextOverlayImage()">Photo ►</button>
    </div>

    <div class="opacity-row">
      <label style="text-align:left; width:auto;">Opacité :</label>
      <input type="range" id="opacityRange" min="0" max="1" step="0.05" value="0.5" oninput="changeOpacity(this.value)">
      <button class="btn-toggle" id="btnToggleOverlay" onclick="toggleOverlay()">Masquer</button>
      <button class="btn-toggle" onclick="toggleCalibration()">⚙️ Ajuster</button>
    </div>
    
    <div class="calibration-panel" id="calibrationPanel">
      <div class="opacity-row">
        <label>Hauteur :</label>
        <input type="range" id="scaleYRange" min="0.80" max="1.20" step="0.005" value="1" oninput="updateCalibration()">
      </div>
      <div class="opacity-row">
        <label>Largeur :</label>
        <input type="range" id="scaleXRange" min="0.80" max="1.20" step="0.005" value="1" oninput="updateCalibration()">
      </div>
      <div class="opacity-row">
        <label>Haut/Bas :</label>
        <input type="range" id="offsetYRange" min="-15" max="15" step="0.1" value="0" oninput="updateCalibration()">
      </div>
      <div class="opacity-row">
        <label>G/D :</label>
        <input type="range" id="offsetXRange" min="-15" max="15" step="0.1" value="0" oninput="updateCalibration()">
      </div>
      <div style="font-size: 0.7rem; color: #888; text-align: center;">Ces 4 réglages sont mémorisés pour tes prochaines captures</div>
    </div>
  </div>

  <div class="board-container">
    <img id="overlayImage" alt="Capture superposée" style="display:none;">
    <div class="grid" id="boardGrid"></div>
  </div>

  <script>
    const cols = ['A','B','C','D','E','F','G','H','I','J','K'];
    const rows = 12;
    let holdStates = {};
    let isOverlayVisible = true;
    window.scannedRouteName = "";
    
    // Variables pour l'état No Kickboard
    let isNoKickboard = false;
    window.scannedNoKickboard = false;

    let overlayImages = [];
    let currentOverlayIndex = 0;
    let currentOcrJob = 0; 

    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice = null;
    let rxCharacteristic = null;

    let localRoutes = JSON.parse(localStorage.getItem('moonboard_custom_routes')) || {};
    
    let savedScaleY = localStorage.getItem('mb_calib_scaleY') || 1;
    let savedScaleX = localStorage.getItem('mb_calib_scaleX') || 1;
    let savedOffsetY = localStorage.getItem('mb_calib_offsetY') || 0;
    let savedOffsetX = localStorage.getItem('mb_calib_offsetX') || 0;

    document.getElementById('scaleYRange').value = savedScaleY;
    document.getElementById('scaleXRange').value = savedScaleX;
    document.getElementById('offsetYRange').value = savedOffsetY;
    document.getElementById('offsetXRange').value = savedOffsetX;

    // === GESTION DU POINT ROUGE NO KICKBOARD ===
    function toggleKickboard() {
      isNoKickboard = !isNoKickboard;
      updateKickboardUI();
      window.scannedNoKickboard = isNoKickboard; // Conserve le choix manuel avant sauvegarde
    }

    function updateKickboardUI() {
      const dot = document.getElementById('kickboardDot');
      if (isNoKickboard) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    }

    function copyTitle() {
      const title = document.getElementById('pageTitle').innerText;
      if (title && !title.includes("⏳")) {
        navigator.clipboard.writeText(title).then(() => {
          const btn = document.getElementById('btnCopyTitle');
          btn.innerText = "✅";
          setTimeout(() => { btn.innerText = "📋"; }, 1500);
        }).catch(() => { alert("Copie impossible sur ce navigateur."); });
      }
    }

    async function exportRoutes() {
      if (Object.keys(localRoutes).length === 0) return alert("Aucun bloc à sauvegarder !");
      const jsonStr = JSON.stringify(localRoutes, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS && navigator.canShare) {
        const file = new File([blob], "mes_blocs_moonboard.json", { type: 'application/json' });
        try {
          await navigator.share({
            files: [file],
            title: 'Sauvegarde MoonBoard',
            text: 'Sauvegarde de mes blocs DIY.'
          });
          return;
        } catch (error) { console.log('Partage annulé ou erreur :', error); }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "mes_blocs_moonboard.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 0);
    }

    // Import classique par fichier
    function importRoutes(event) {
      const file = event.target.files[0];
      if(!file) return;
      
      // Verification simpliste de l'extension pour iOS
      if(!file.name.toLowerCase().endsWith('.json')){
          alert("Erreur : Safari a probablement ajouté '.txt' à ton fichier. Essaie d'utiliser le bouton 'Coller JSON' à la place, c'est plus simple sur iPhone !");
          event.target.value = '';
          return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedRoutes = JSON.parse(e.target.result);
          processImportData(importedRoutes);
        } catch(err) { alert("Erreur : Le fichier n'est pas un JSON valide."); }
      };
      reader.readAsText(file);
      event.target.value = ''; 
    }

    // NOUVEAU : Importation par copier/coller direct
    async function importFromPaste() {
        try {
            // Safari demande une permission explicite ou un contexte sécurisé (HTTPS)
            // Sur iOS, prompt est souvent plus robuste pour récupérer du texte collé
            const text = prompt("Collez le code JSON généré par l'IA ici :");
            if (!text || text.trim() === "") return;

            const importedRoutes = JSON.parse(text);
            processImportData(importedRoutes);
        } catch (err) {
            alert("Erreur : Le texte collé n'est pas un JSON valide. Assure-toi d'avoir bien copié TOUT le texte généré par l'IA, y compris les accolades { et }.");
        }
    }
    
    // Fonction commune pour traiter les données importées
    function processImportData(data){
        if(!data || typeof data !== 'object') {
            alert("Erreur : Données invalides.");
            return;
        }
        
        const count = Object.keys(data).length;
        if(count === 0){
            alert("Aucun bloc trouvé dans les données.");
            return;
        }

        // Fusionner avec les routes locales
        localRoutes = { ...localRoutes, ...data };
        localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
        initRouteSelector();
        alert(`Succès ! ${count} bloc(s) importé(s) et fusionné(s) avec ta liste.`);
    }

    function initRouteSelector() {
      const selector = document.getElementById('routeSelect');
      const filterGrade = document.getElementById('gradeFilter').value;
      const currentVal = selector.value; 
      
      selector.innerHTML = '<option value="">-- Choisir un bloc --</option>';
      let hasValidCurrent = false;

      Object.keys(localRoutes).forEach(routeName => {
        if (filterGrade === "" || routeName.includes(filterGrade)) {
            const opt = document.createElement('option');
            opt.value = routeName;
            const prefix = localRoutes[routeName].completed ? "✅ " : "";
            opt.innerText = prefix + routeName;
            selector.appendChild(opt);
            if (routeName === currentVal) hasValidCurrent = true;
        }
      });
      
      if (hasValidCurrent) selector.value = currentVal;
      else selector.value = "";
      
      updateCheckboxState();
    }

    function saveCurrentRoute() {
      let route = { depart: [], progression: [], arrivee: [], completed: false, noKickboard: false };
      let hasHolds = false;
      Object.keys(holdStates).forEach(id => {
        if (holdStates[id] === 1) { route.depart.push(id); hasHolds = true; }
        if (holdStates[id] === 2) { route.progression.push(id); hasHolds = true; }
        if (holdStates[id] === 3) { route.arrivee.push(id); hasHolds = true; }
      });
      
      if (!hasHolds) { alert("Le panneau est vide !"); return; }

      let defaultName = window.scannedRouteName ? window.scannedRouteName : "Mon Bloc";
      let routeName = prompt("Nom et cotation du bloc :", defaultName);
      if (!routeName || routeName.trim() === "") return;

      if (localRoutes[routeName]) {
          route.completed = localRoutes[routeName].completed;
      }
      
      // Enregistre l'état du point rouge
      route.noKickboard = isNoKickboard;

      localRoutes[routeName] = route;
      localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
      initRouteSelector();
      document.getElementById('routeSelect').value = routeName;
      loadSelectedRoute();
    }

    function deleteCurrentRoute() {
      const selector = document.getElementById('routeSelect');
      const routeName = selector.value;
      
      if (!routeName || !localRoutes[routeName]) {
        alert("Aucun bloc sauvegardé n'est actuellement sélectionné.");
        return;
      }
      
      if (confirm(`Es-tu sûr de vouloir supprimer définitivement le bloc "${routeName}" ?`)) {
        delete localRoutes[routeName];
        localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
        initRouteSelector();
        clearBoard(); 
      }
    }

    function clearSavedRoutes() {
      if (Object.keys(localRoutes).length === 0) return alert("Liste déjà vide !");
      if (confirm("⚠️ ATTENTION : Es-tu sûr de vouloir effacer TOUS les blocs enregistrés de l'application ? Action irréversible !")) {
        localStorage.removeItem('moonboard_custom_routes');
        localRoutes = {};
        initRouteSelector();
        document.getElementById('pageTitle').innerText = "Mini MoonBoard";
        isNoKickboard = false;
        updateKickboardUI();
      }
    }

    function loadSelectedRoute() {
      const selector = document.getElementById('routeSelect');
      if (!selector) return;
      const routeName = selector.value;
      
      Object.keys(holdStates).forEach(id => { holdStates[id] = 0; updateUI(id); });
      
      if (routeName && localRoutes[routeName]) {
        const route = localRoutes[routeName];
        if (route.depart) route.depart.forEach(id => { holdStates[id] = 1; updateUI(id); });
        if (route.progression) route.progression.forEach(id => { holdStates[id] = 2; updateUI(id); });
        if (route.arrivee) route.arrivee.forEach(id => { holdStates[id] = 3; updateUI(id); });
        
        document.getElementById('pageTitle').innerText = routeName;
        isNoKickboard = !!route.noKickboard;
      } else {
        document.getElementById('pageTitle').innerText = window.scannedRouteName || "Mini MoonBoard";
        isNoKickboard = window.scannedNoKickboard || false;
      }
      
      updateKickboardUI();
      updateCheckboxState();
      sendBLEFrame();
    }

    function prevRoute() {
      const selector = document.getElementById('routeSelect');
      const options = Array.from(selector.options).filter(opt => opt.value !== "");
      if (options.length === 0) return;
      let idx = options.findIndex(opt => opt.value === selector.value);
      if (idx <= 0) idx = options.length - 1; else idx--;
      selector.value = options[idx].value;
      loadSelectedRoute();
    }

    function nextRoute() {
      const selector = document.getElementById('routeSelect');
      const options = Array.from(selector.options).filter(opt => opt.value !== "");
      if (options.length === 0) return;
      let idx = options.findIndex(opt => opt.value === selector.value);
      if (idx === -1 || idx === options.length - 1) idx = 0; else idx++;
      selector.value = options[idx].value;
      loadSelectedRoute();
    }

    function toggleCompleted() {
      const routeName = document.getElementById('routeSelect').value;
      if (routeName && localRoutes[routeName]) {
        localRoutes[routeName].completed = document.getElementById('chkCompleted').checked;
        localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
        initRouteSelector(); 
      }
    }

    function updateCheckboxState() {
      const routeName = document.getElementById('routeSelect').value;
      const chk = document.getElementById('chkCompleted');
      if (routeName && localRoutes[routeName]) {
        chk.style.visibility = "visible";
        chk.checked = !!localRoutes[routeName].completed;
      } else {
        chk.style.visibility = "hidden";
        chk.checked = false;
      }
    }

    // === GRILLE INTERACTIVE ===
    const gridEl = document.getElementById('boardGrid');
    for (let r = rows; r >= 1; r--) {
      cols.forEach(c => {
        const holdId = `${c}${r}`;
        holdStates[holdId] = 0;
        const div = document.createElement('div');
        div.className = 'hold state-0';
        div.id = `hold-${holdId}`;
        div.onclick = () => toggleHold(holdId);
        gridEl.appendChild(div);
      });
    }
    initRouteSelector();

    function toggleHold(holdId) {
      holdStates[holdId] = (holdStates[holdId] + 1) % 4;
      updateUI(holdId);
      document.getElementById('routeSelect').value = ""; 
      updateCheckboxState();
      sendBLEFrame();
    }

    function updateUI(holdId) {
      const el = document.getElementById(`hold-${holdId}`);
      if(el) el.className = `hold state-${holdStates[holdId]}`;
    }

    function clearBoard() {
      document.getElementById('routeSelect').value = ""; 
      document.getElementById('pageTitle').innerText = window.scannedRouteName || "Mini MoonBoard";
      isNoKickboard = window.scannedNoKickboard || false;
      updateKickboardUI();
      updateCheckboxState();
      Object.keys(holdStates).forEach(id => { if(holdStates[id] !== 0) { holdStates[id] = 0; updateUI(id); }});
      sendBLEFrame();
    }

    // === GESTION DU CALQUE ET CALIBRATION 4 AXES ===
    function changeOpacity(val) { document.getElementById('overlayImage').style.opacity = val; }

    function toggleOverlay() {
      const overlay = document.getElementById('overlayImage');
      const btn = document.getElementById('btnToggleOverlay');
      isOverlayVisible = !isOverlayVisible;
      if (isOverlayVisible) {
        overlay.style.display = "block";
        btn.innerText = "Masquer";
      } else {
        overlay.style.display = "none";
        btn.innerText = "Afficher";
      }
    }

    function toggleCalibration() {
      const panel = document.getElementById('calibrationPanel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }

    function updateCalibration() {
      savedScaleY = document.getElementById('scaleYRange').value;
      savedScaleX = document.getElementById('scaleXRange').value;
      savedOffsetY = document.getElementById('offsetYRange').value;
      savedOffsetX = document.getElementById('offsetXRange').value;
      
      localStorage.setItem('mb_calib_scaleY', savedScaleY);
      localStorage.setItem('mb_calib_scaleX', savedScaleX);
      localStorage.setItem('mb_calib_offsetY', savedOffsetY);
      localStorage.setItem('mb_calib_offsetX', savedOffsetX);
      
      applyCalibration();
    }

    function applyCalibration() {
      const overlay = document.getElementById('overlayImage');
      overlay.style.transform = `translate(${savedOffsetX}%, ${savedOffsetY}%) scale(${savedScaleX}, ${savedScaleY})`;
    }

    // === GESTION MULTI-IMAGES ET DECOUPAGE ===
    document.getElementById('fileInput').addEventListener('change', function(e) {
      if(!e.target.files || e.target.files.length === 0) return;
      overlayImages = Array.from(e.target.files).map(file => URL.createObjectURL(file));
      currentOverlayIndex = 0;
      if (overlayImages.length > 1) document.getElementById('multiImageNav').style.display = "flex";
      else document.getElementById('multiImageNav').style.display = "none";

      loadOverlayImage(overlayImages[currentOverlayIndex]);
      e.target.value = ''; 
    });

    function prevOverlayImage() {
      if (overlayImages.length === 0) return;
      currentOverlayIndex = (currentOverlayIndex === 0) ? overlayImages.length - 1 : currentOverlayIndex - 1;
      loadOverlayImage(overlayImages[currentOverlayIndex]);
    }

    function nextOverlayImage() {
      if (overlayImages.length === 0) return;
      currentOverlayIndex = (currentOverlayIndex + 1) % overlayImages.length;
      loadOverlayImage(overlayImages[currentOverlayIndex]);
    }

    function loadOverlayImage(imageUrl) {
      const titleEl = document.getElementById('pageTitle');
      titleEl.innerText = "⏳ Découpage...";
      titleEl.style.color = "#f39c12";
      
      isNoKickboard = false;
      window.scannedNoKickboard = false;
      updateKickboardUI();
      
      document.getElementById('imageCounter').innerText = `${currentOverlayIndex + 1}/${overlayImages.length}`;
      
      const jobId = ++currentOcrJob; 
      const img = new Image();
      
      img.onload = function() {
        if (jobId !== currentOcrJob) return;

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

        let topY = -1, botY = -1;
        let scanX = Math.floor(canvas.width * 0.05); 
        for (let y = 0; y < canvas.height; y++) {
           let i = (y * canvas.width + scanX) * 4;
           if (imgData[i] > 150 && imgData[i+1] > 150 && imgData[i+2] < 100) {
               if (topY === -1) topY = y;
               botY = y;
           }
        }
        
        if (topY === -1 || (botY - topY) < (canvas.height * 0.3)) { 
            topY = canvas.height * 0.25; botY = canvas.height * 0.85; 
        }
        
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = canvas.width;
        cropCanvas.height = botY - topY;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(img, 0, topY, canvas.width, botY - topY, 0, 0, cropCanvas.width, cropCanvas.height);

        const overlay = document.getElementById('overlayImage');
        overlay.src = cropCanvas.toDataURL();
        overlay.style.display = "block";
        overlay.style.opacity = document.getElementById('opacityRange').value;
        
        isOverlayVisible = true;
        document.getElementById('btnToggleOverlay').innerText = "Masquer";
        document.getElementById('overlayControls').style.display = "flex";
        applyCalibration(); 

        if (typeof Tesseract !== 'undefined') {
            titleEl.innerText = "⏳ Lecture OCR...";
            setTimeout(async () => {
                if (jobId !== currentOcrJob) return; 

                try {
                    const headerCanvas = document.createElement('canvas');
                    headerCanvas.width = img.width;
                    // Scanne le haut de l'image (jusqu'à 35%) pour attraper le bandeau No Kickboard
                    headerCanvas.height = img.height * 0.35; 
                    const hCtx = headerCanvas.getContext('2d');
                    hCtx.drawImage(img, 0, 0);
                    
                    const { data } = await Tesseract.recognize(headerCanvas.toDataURL(), 'eng');
                    if (jobId !== currentOcrJob) return; 

                    let detectedName = "";
                    let detectedGrade = "";
                    
                    const rawText = data.text.toLowerCase();
                    
                    // Détection du texte "no kickboard"
                    if (rawText.includes('no kickboard') || rawText.includes('footless')) {
                        isNoKickboard = true;
                        window.scannedNoKickboard = true;
                        updateKickboardUI();
                    }

                    const lines = data.lines.map(l => l.text.trim());
                    let setByIndex = lines.findIndex(l => l.toLowerCase().includes('set by'));
                    
                    if (setByIndex > 0) detectedName = lines[setByIndex - 1];
                    else {
                       let validLine = lines.find(l => /[A-Za-z]/.test(l) && l.length > 3 && !l.includes(':'));
                       if(validLine) detectedName = validLine;
                    }

                    let gradeLine = lines.find(l => l.toLowerCase().includes('user') || l.toLowerCase().includes('setter'));
                    if (gradeLine) {
                        let gradeMatch = gradeLine.match(/([4-9][A-C]\+?|V\d+)/i);
                        if (gradeMatch) detectedGrade = gradeMatch[1].toUpperCase();
                    }

                    detectedName = detectedName.replace(/[^a-zA-Z0-9 \-\+\(\)\.]/g, '').replace(/\s+/g, ' ').trim();
                    if(detectedName.length < 2) detectedName = "Nouveau Bloc";
                    if(detectedGrade && !detectedName.includes(detectedGrade)) detectedName = `${detectedName} (${detectedGrade})`;

                    window.scannedRouteName = detectedName;
                    titleEl.innerText = detectedName;
                } catch (err) {
                    if (jobId !== currentOcrJob) return;
                    titleEl.innerText = "Mini MoonBoard";
                }
            }, 50);
        } else {
            titleEl.innerText = "Mini MoonBoard";
        }
      };
      img.src = imageUrl;
    }

    // === GESTION DU BLUETOOTH ===
    async function toggleBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return; 
      }
      try {
        bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'MoonBoard' }], optionalServices: [SERVICE_UUID] });
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        document.getElementById('btnConnect').innerText = "Se déconnecter";
        document.getElementById('statusIndicator').className = "status-dot connected";
      } catch (err) { alert("Erreur BLE : " + err); onDisconnected(); }
    }

    function onDisconnected() {
      rxCharacteristic = null;
      document.getElementById('btnConnect').innerText = "Se connecter";
      document.getElementById('statusIndicator').className = "status-dot disconnected";
    }

    function sendBLEFrame() {
      if (!rxCharacteristic) return;
      let parts = [];
      Object.keys(holdStates).forEach(id => {
        if (holdStates[id] === 1) parts.push(`S${id}`);
        else if (holdStates[id] === 2) parts.push(`P${id}`);
        else if (holdStates[id] === 3) parts.push(`F${id}`);
      });
      const encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(`l#${parts.join(',')}#`));
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
