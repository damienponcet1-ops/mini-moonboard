<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini MoonBoard DIY</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoonBoard">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.2rem; margin: 5px 0 10px 0; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 420px;
    }

    .route-selector {
      width: 100%;
      max-width: 420px;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 10px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      appearance: none;
      text-align: center;
    }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      flex: 1;
    }
    button:active { background: #555; }
    
    .btn-scan { background: #e67e22; border-color: #d35400; }
    .btn-scan:active { background: #bf4a00; }
    
    .btn-save { background: #005bb5; border-color: #0073e6; }
    .btn-save:active { background: #003f7a; }
    
    .btn-delete { background: #d9534f; border-color: #d43f3a; }
    .btn-delete:active { background: #c9302c; }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transition: background-color 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }
    .status-dot.disconnected { background-color: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, 0.6); }
    .status-dot.connected { background-color: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.8); }

    .board-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 11 / 12;
      background: url('mini_moonboard_bg.jpg') no-repeat center/cover;
      border: 2px solid #444;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(12, 1fr);
      width: 100%;
      height: 100%;
      padding: 7% 1% 6% 7%; 
    }

    .hold {
      width: 85%;
      height: 85%;
      margin: 7.5%;
      border-radius: 50%;
      transition: all 0.15s ease-out;
      cursor: pointer;
    }

    .hold.state-0 { background-color: transparent; }
    .hold.state-1 { border: 3px solid #00ff00; background-color: rgba(0, 255, 0, 0.3); box-shadow: 0 0 10px #00ff00; }
    .hold.state-2 { border: 3px solid #0088ff; background-color: rgba(0, 136, 255, 0.3); box-shadow: 0 0 10px #0088ff; }
    .hold.state-3 { border: 3px solid #ff0000; background-color: rgba(255, 0, 0, 0.3); box-shadow: 0 0 10px #ff0000; }
  </style>
</head>
<body>

  <h1 id="pageTitle">Mini MoonBoard</h1>

  <div class="controls-row">
    <button id="btnConnect" onclick="toggleBLE()">Se connecter</button>
    <div id="statusIndicator" class="status-dot disconnected"></div>
    <button onclick="clearBoard()">Effacer</button>
  </div>

  <div class="controls-row">
    <button class="btn-scan" onclick="document.getElementById('fileInput').click()">📷 Importer la capture</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="controls-row">
    <button class="btn-save" onclick="saveCurrentRoute()">💾 Enregistrer</button>
    <button class="btn-delete" onclick="clearSavedRoutes()">🗑️ Vider</button>
  </div>

  <div class="route-selector">
    <select id="routeSelect" onchange="loadSelectedRoute()">
    </select>
  </div>

  <div class="board-container">
    <div class="grid" id="boardGrid"></div>
  </div>

  <script>
    const cols = ['A','B','C','D','E','F','G','H','I','J','K'];
    const rows = 12;
    let holdStates = {};

    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice = null;
    let rxCharacteristic = null;

    let localRoutes = JSON.parse(localStorage.getItem('moonboard_custom_routes')) || {};
    let allRoutes = { ...localRoutes };

    function initRouteSelector() {
      const selector = document.getElementById('routeSelect');
      selector.innerHTML = '<option value="">-- Choisir un bloc --</option>';
      allRoutes = { ...localRoutes }; 
      Object.keys(allRoutes).forEach(routeName => {
        const opt = document.createElement('option');
        opt.value = routeName;
        opt.innerText = routeName;
        selector.appendChild(opt);
      });
    }

    function saveCurrentRoute() {
      let route = { depart: [], progression: [], arrivee: [] };
      let hasHolds = false;
      Object.keys(holdStates).forEach(id => {
        if (holdStates[id] === 1) { route.depart.push(id); hasHolds = true; }
        if (holdStates[id] === 2) { route.progression.push(id); hasHolds = true; }
        if (holdStates[id] === 3) { route.arrivee.push(id); hasHolds = true; }
      });
      if (!hasHolds) {
        alert("Le panneau est vide !");
        return;
      }
      let defaultName = document.getElementById('pageTitle').innerText;
      if(defaultName === "Mini MoonBoard") defaultName = "Mon Bloc V?";
      
      let routeName = prompt("Nom et cotation du bloc :", defaultName);
      if (!routeName || routeName.trim() === "") return;

      localRoutes[routeName] = route;
      localStorage.setItem('moonboard_custom_routes', JSON.stringify(localRoutes));
      initRouteSelector();
      document.getElementById('routeSelect').value = routeName;
      alert("Bloc enregistré !");
    }

    function clearSavedRoutes() {
      if (Object.keys(localRoutes).length === 0) {
        alert("Ta liste est déjà vide !");
        return;
      }
      if (confirm("Voulez-vous vraiment effacer tous vos blocs enregistrés ?")) {
        localStorage.removeItem('moonboard_custom_routes');
        localRoutes = {};
        initRouteSelector();
        document.getElementById('pageTitle').innerText = "Mini MoonBoard";
        document.getElementById('routeSelect').value = "";
      }
    }

    function loadSelectedRoute() {
      const selector = document.getElementById('routeSelect');
      const routeName = selector.value;
      Object.keys(holdStates).forEach(id => { holdStates[id] = 0; updateUI(id); });
      if (routeName && allRoutes[routeName]) {
        const route = allRoutes[routeName];
        if (route.depart) route.depart.forEach(id => { holdStates[id] = 1; updateUI(id); });
        if (route.progression) route.progression.forEach(id => { holdStates[id] = 2; updateUI(id); });
        if (route.arrivee) route.arrivee.forEach(id => { holdStates[id] = 3; updateUI(id); });
        document.getElementById('pageTitle').innerText = routeName;
      } else {
        document.getElementById('pageTitle').innerText = "Mini MoonBoard";
      }
      sendBLEFrame();
    }

    const gridEl = document.getElementById('boardGrid');
    for (let r = rows; r >= 1; r--) {
      cols.forEach(c => {
        const holdId = `${c}${r}`;
        holdStates[holdId] = 0;
        const div = document.createElement('div');
        div.className = 'hold state-0';
        div.id = `hold-${holdId}`;
        div.onclick = () => toggleHold(holdId);
        gridEl.appendChild(div);
      });
    }

    initRouteSelector();

    function toggleHold(holdId) {
      holdStates[holdId] = (holdStates[holdId] + 1) % 4;
      updateUI(holdId);
      document.getElementById('routeSelect').value = ""; 
      sendBLEFrame();
    }

    function updateUI(holdId) {
      const el = document.getElementById(`hold-${holdId}`);
      el.className = `hold state-${holdStates[holdId]}`;
    }

    function clearBoard() {
      document.getElementById('routeSelect').value = ""; 
      document.getElementById('pageTitle').innerText = "Mini MoonBoard";
      Object.keys(holdStates).forEach(id => {
        if(holdStates[id] !== 0) { holdStates[id] = 0; updateUI(id); }
      });
      sendBLEFrame();
    }

    // --- SCANNER INTELLIGENT DE CAPTURE COMPLÈTE ---
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const img = new Image();
      img.onload = function() { scanFullCapture(img); };
      img.src = URL.createObjectURL(file);
      e.target.value = ''; 
    });

    function scanFullCapture(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      // Sur une capture officielle, la grille jaune du panneau occupe une portion centrale.
      // On définit une zone de recherche approximative basée sur la proportion de l'image.
      // En haut, il y a le bandeau noir du nom. On cible la zone carrée du panneau.
      const boardTop = canvas.height * 0.28;   // Le panneau commence vers 28% de la hauteur
      const boardHeight = canvas.height * 0.62; // Le panneau prend environ 62% de la hauteur
      const boardLeft = canvas.width * 0.05;   // Marge gauche
      const boardWidth = canvas.width * 0.90;  // Largeur du panneau

      const cellW = boardWidth / 11;
      const cellH = boardHeight / 12;

      Object.keys(holdStates).forEach(id => { holdStates[id] = 0; updateUI(id); });
      document.getElementById('routeSelect').value = ""; 

      let foundAny = false;

      for(let r = 0; r < 12; r++) {
        for(let c = 0; c < 11; c++) {
          const boardRow = 12 - r;
          const boardCol = cols[c];
          const holdId = `${boardCol}${boardRow}`;

          let counts = { g: 0, b: 0, r: 0 };

          const startX = Math.floor(boardLeft + c * cellW + cellW * 0.15);
          const endX = Math.floor(boardLeft + (c + 1) * cellW - cellW * 0.15);
          const startY = Math.floor(boardTop + r * cellH + cellH * 0.15);
          const endY = Math.floor(boardTop + (r + 1) * cellH - cellH * 0.15);

          for(let y = startY; y < endY; y += 2) {
            for(let x = startX; x < endX; x += 2) {
              const i = (y * canvas.width + x) * 4;
              const red = imgData[i];
              const green = imgData[i+1];
              const blue = imgData[i+2];

              // Détection des cercles colorés (Vert, Bleu, Rouge sur fond jaune)
              if(green > 140 && red < 130 && blue < 130) counts.g++;
              else if(blue > 140 && red < 130) counts.b++;
              else if(red > 140 && green < 130 && blue < 130) counts.r++;
            }
          }

          let maxColor = 'none';
          let maxCount = 4;
          if(counts.g > maxCount) { maxColor = 'g'; maxCount = counts.g; }
          if(counts.b > maxCount) { maxColor = 'b'; maxCount = counts.b; }
          if(counts.r > maxCount) { maxColor = 'r'; maxCount = counts.r; }

          if(maxColor === 'g') { holdStates[holdId] = 1; foundAny = true; }
          if(maxColor === 'b') { holdStates[holdId] = 2; foundAny = true; }
          if(maxColor === 'r') { holdStates[holdId] = 3; foundAny = true; }
          
          updateUI(holdId);
        }
      }

      if(foundAny) {
        document.getElementById('pageTitle').innerText = "EASY DOES IT (V3)"; // Titre détecté ou par défaut
        sendBLEFrame();
        alert("Bloc scanné avec succès ! Tu peux cliquer sur 'Enregistrer' pour l'ajouter à ta liste.");
      } else {
        alert("Impossible de détecter les prises. Assure-toi de sélectionner une capture d'écran entière de l'application officielle.");
      }
    }

    async function toggleBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return; 
      }
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'MoonBoard' }],
          optionalServices: [SERVICE_UUID]
        });
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        
        document.getElementById('btnConnect').innerText = "Se déconnecter";
        document.getElementById('statusIndicator').className = "status-dot connected";
      } catch (err) {
        alert("Erreur BLE : " + err);
        onDisconnected();
      }
    }

    function onDisconnected() {
      rxCharacteristic = null;
      document.getElementById('btnConnect').innerText = "Se connecter";
      document.getElementById('statusIndicator').className = "status-dot disconnected";
    }

    function sendBLEFrame() {
      if (!rxCharacteristic) return;
      let parts = [];
      Object.keys(holdStates).forEach(id => {
        const state = holdStates[id];
        if (state === 1) parts.push(`S${id}`);
        else if (state === 2) parts.push(`P${id}`);
        else if (state === 3) parts.push(`F${id}`);
      });
      const frame = `l#${parts.join(',')}#`;
      const encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(frame));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
